plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
	maven {
		name = 'Modrinth'
		url = 'https://api.modrinth.com/maven'
	}
}

loom {
	splitEnvironmentSourceSets()

	// 访问拓宽：鱼牌要读 EntityBucketItem 的私有 entityType 字段
	accessWidenerPath = file("src/main/resources/crabbersdelight.accesswidener")

	// 生成 mixin 反混淆映射（refmap）：开发环境不需要，但正式分发的 jar 必须有，
	// 否则别人用发行版时所有 @Inject 都会因为方法名对不上而失效。
	mixin {
		useLegacyMixinAp = true
		defaultRefmapName = "crabbersdelight-refmap.json"
	}

	mods {
		"crabbersdelight" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

fabricApi {
	configureDataGeneration {
		client = true
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Farmer's Delight（Refabricated，Fabric 移植版）——原模组的必需依赖
	// 运行时：玩家装的是 run/mods 里的 2.5.5，由 Loader 在开发环境里自动重映射并加载；
	// 这里的 2.1.2 是为了带上它依赖的 porting_lib（2.5.5 的 POM 不声明 porting_lib，
	// 直接用它当 modImplementation 会因为找不到 porting_lib 的 LazyRegistrar 之类而启动崩溃）。
	modImplementation "maven.modrinth:farmers-delight-refabricated:1.20.1-2.1.2"
	// 编译期再看一份 2.5.5 的 API（只为让砧板 mixin 能写上 3 参数的 rollResults；
	// 不进运行时 classpath，避免和 run/mods 里的 2.5.5 打架）
	modCompileOnly("maven.modrinth:farmers-delight-refabricated:1.20.1-2.5.5") { transitive = false }

	// Forge Config API Port：在 Fabric 上提供 ForgeConfigSpec，配置代码几乎可以原样移植
	modImplementation "maven.modrinth:forge-config-api-port:v8.0.3-1.20.1-Fabric"

	// JEI（可选集成，只在编译期需要；运行时有没有 JEI 都能玩）
	modCompileOnly "maven.modrinth:jei:15.20.0.130"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
